name: Deploy radar to VPS

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "reply-style.md"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/radar
            git pull origin master
            docker compose up -d --build
            sleep 3
            if docker compose ps --status running | grep -q radar-watcher; then
              echo "DEPLOY OK: radar-watcher running"
            else
              echo "DEPLOY FAILED: radar-watcher not running"
              docker compose logs --tail 20 radar-watcher
              exit 1
            fi
