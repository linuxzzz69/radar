name: Deploy radar to VPS

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "VPS-SETUP.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd /opt/radar
            git pull --rebase origin master

            # rebuild image (no-cache for the code layer to avoid stale COPY cache)
            docker compose build radar-watcher

            # recreate containers
            docker compose up -d --force-recreate

            sleep 5

            # health check: watcher alive + log line clean
            if ! docker compose ps --status running | grep -q radar-watcher; then
              echo "DEPLOY FAILED: radar-watcher not running"
              docker compose logs --tail 30 radar-watcher
              exit 1
            fi
            if docker compose logs --tail 30 radar-watcher 2>/dev/null | grep -q "Traceback (most recent call last)"; then
              echo "DEPLOY FAILED: traceback in watcher logs"
              docker compose logs --tail 30 radar-watcher
              exit 1
            fi

            echo "DEPLOY OK: $(git log --oneline -1) | containers running"
