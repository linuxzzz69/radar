name: Deploy radar to VPS

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "VPS-SETUP.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            # kill the systemd twin (old radar.service) - only Docker runs the bot
            systemctl disable --now radar 2>/dev/null || true
            pkill -9 -f "watcher.py" 2>/dev/null || true
            sleep 1
            cd /opt/radar
            git pull --rebase origin master

            docker compose down
            docker compose build radar-watcher
            docker compose up -d --force-recreate

            sleep 8

            if ! docker compose ps --status running | grep -q radar-watcher; then
              echo "DEPLOY FAILED: radar-watcher not running"
              docker compose logs --tail 30 radar-watcher
              exit 1
            fi

            # new logs only (down/up cleared history). Check the CURRENT run for a startup crash:
            if docker compose logs radar-watcher 2>/dev/null | grep -q "Traceback (most recent call last)"; then
              echo "DEPLOY FAILED: traceback in watcher startup"
              docker compose logs --tail 30 radar-watcher
              exit 1
            fi

            echo "DEPLOY OK: $(git log --oneline -1) | containers running, watcher clean"
