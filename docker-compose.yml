services:
  # Telegram radar + trading bot (watcher.py)
  radar-watcher:
    build: .
    container_name: radar-watcher
    restart: always
    # env_file removed: .env is OPTIONAL, uncomment if you set one
    # env_file:
    #   - .env
    volumes:
      - ./watch_config.json:/app/watch_config.json    # rw: /autobuy and /add edit it live
      - ./watcher_state.json:/app/watcher_state.json
      - ./.bot_wallet.json:/app/.bot_wallet.json:ro        # hot wallet key (mounted, never baked)
      - ./.bot_positions.json:/app/.bot_positions.json     # positions book — MUST survive deploys
      - ./.bot_sltp.json:/app/.bot_sltp.json               # SL/TP/limit rules
      - ./.bot_cards.json:/app/.bot_cards.json             # live PnL cards
      - ./.trade_history.json:/app/.trade_history.json     # audit log + daily cap
      - ./.denylist.json:/app/.denylist.json               # deny-list
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('https://api.telegram.org',timeout=10)\""]
      interval: 120s
      timeout: 15s
      retries: 3


  # Heart Attack module (DLMM position open/close/claim)
  ha-service:
    image: node:20-slim
    container_name: ha-service
    restart: always
    working_dir: /app
    environment:
      - RPC_URL=https://solana-rpc.publicnode.com
      - PORT=8078
    volumes:
      - ./radar-ha:/app
      - ./.bot_wallet.json:/app/.bot_wallet.json:ro
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node dlmm_service.js"
    ports:
      - "127.0.0.1:8078:8078"   # host-only (moves wallet funds, never public)

  # DBC on-chain state microservice (official Meteora SDK)
  dbc-state:
    image: node:20-slim
    container_name: dbc-state
    restart: always
    working_dir: /app
    environment:
      - RPC_URL=https://api.mainnet-beta.solana.com
    volumes:
      - ./radar-dbc:/app
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node dbc_state.js"
    ports:
      - "127.0.0.1:8077:8077"   # host-only, so dbc_scanner/fresh_battery reach it

networks:
  default:
    name: radar
